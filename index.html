<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TgT - Toll Gate Talk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <div id="setup-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-md text-center">
            <h1 class="text-4xl font-extrabold text-indigo-400 mb-2 tracking-tight">TgT</h1>
            <p class="text-slate-400 text-sm mb-6">Toll Gate Talk • Instant Network Chat</p>
            <input type="text" id="username-input" placeholder="Create a username..." 
                   class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 mb-4 text-center text-lg">
            <button onclick="connectToChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200 cursor-pointer">
                Join Chat Room
            </button>
        </div>
    </div>

    <div class="flex flex-col flex-1 h-full bg-slate-950">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
            <div>
                <h3 class="font-bold text-white">Main Chat Lobby</h3>
                <p id="chat-status" class="text-xs text-amber-500 font-medium">Connecting to network stream...</p>
            </div>
            <div class="text-right">
                <span id="my-name-tag" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400 font-mono"></span>
            </div>
        </div>

        <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
            </div>

        <div class="p-4 border-t border-slate-800 bg-slate-900">
            <form id="message-form" onsubmit="sendMessage(event)" class="flex gap-2">
                <input type="text" id="message-input" autocomplete="off"
                       placeholder="Type a message..." 
                       class="flex-1 bg-slate-800 text-white rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:border-indigo-500">
                <button type="submit" id="send-btn"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 rounded-xl font-medium transition cursor-pointer">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        let username = "User";
        let client;
        // Unique room topic name so your messages don't get mixed up with other public users
        const chatRoomTopic = "tgt_chat_room_secure_98314"; 
        // Unique random ID for this session instance
        const myId = "ID-" + Math.random().toString(36).substr(2, 6).toUpperCase();

        function connectToChat() {
            const inputName = document.getElementById('username-input').value.trim();
            if(!inputName) return alert("Please enter a username!");
            username = inputName;

            document.getElementById('my-name-tag').innerText = `${username} (${myId})`;
            document.getElementById('setup-screen').classList.add('hidden');

            // Connects via encrypted WebSockets to a free, public server broker
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            client.on('connect', () => {
                document.getElementById('chat-status').innerText = "Connected online";
                document.getElementById('chat-status').className = "text-xs text-emerald-400 font-medium";
                
                // Subscribe to the shared channel room
                client.subscribe(chatRoomTopic);
                
                // Broadcast that you joined
                sendSystemNotice(`${username} joined the chat room.`);
            });

            client.on('message', (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.type === 'chat') {
                        appendMessage(data.senderId === myId ? 'me' : 'them', data.user, data.text);
                    } else if (data.type === 'system' && data.senderId !== myId) {
                        appendSystemMessage(data.text);
                    }
                } catch (e) { console.error("Data error", e); }
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !client || !client.connected) return;

            const payload = {
                type: 'chat',
                senderId: myId,
                user: username,
                text: text
            };

            client.publish(chatRoomTopic, JSON.stringify(payload));
            input.value = '';
        }

        function sendSystemNotice(msgText) {
            if(!client || !client.connected) return;
            client.publish(chatRoomTopic, JSON.stringify({
                type: 'system',
                senderId: myId,
                text: msgText
            }));
        }

        function appendMessage(direction, senderName, text) {
            const container = document.getElementById('messages-container');
            const isMe = direction === 'me';
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

            wrapper.innerHTML = `
                <span class="text-xs text-slate-500 mb-1 px-1">${isMe ? 'You' : senderName}</span>
                <div class="max-w-md rounded-2xl px-4 py-2.5 shadow-md text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none'}">
                    <p class="break-words">${escapeHTML(text)}</p>
                </div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('messages-container');
            const wrapper = document.createElement('div');
            wrapper.className = "flex justify-center my-2";
            wrapper.innerHTML = `<span class="text-xs bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-500 italic">${escapeHTML(text)}</span>`;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
